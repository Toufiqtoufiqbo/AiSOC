id: det-application-087
name: Model-Provider Key Minted or Used From an Unfamiliar Address
description: An API-key action on a model provider arrived from an address this tenant has never been
  seen to use. A provider key is a bearer credential with no device binding and no MFA, so where it is
  used from is most of what is knowable about who is holding it.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- tlp.white
category: application
log_source:
  product: llm_usage
  service: audit
detection:
  condition: |
    event_type CONTAINS "api_key"
    AND source_ip_seen_before == false
false_positives:
- An administrator working from home or a new office for the first time
- A CI runner whose egress address rotates
playbook: tpl-account-compromise
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
