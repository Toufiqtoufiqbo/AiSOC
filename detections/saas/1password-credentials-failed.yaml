id: det-saas-041
name: 1Password Sign-In Failed on Credentials
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Sign-In Failed
  on Credentials'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1110
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    category == "credentials_failed"
false_positives:
- A mistyped master password
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
