id: det-saas-049
name: 1Password Failed Sign-In From an Unrecognised Address
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Failed Sign-In
  From an Unrecognised Address'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1110
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    category == "credentials_failed"
    AND src_ip NOT STARTSWITH_ANY ["10.", "192.168."]
false_positives:
- A user mistyping their password from home
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
