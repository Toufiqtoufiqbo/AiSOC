id: det-saas-043
name: 1Password Sign-In Blocked by Firewall Rules
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Sign-In Blocked
  by Firewall Rules'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    category == "firewall_failed"
false_positives:
- A user travelling outside an allowed region
- A new office address
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
