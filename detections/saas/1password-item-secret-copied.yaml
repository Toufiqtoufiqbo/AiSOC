id: det-saas-051
name: 1Password Item Secret Copied to the Clipboard
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Item Secret
  Copied to the Clipboard'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1555.005
- mitre.attack.t1115
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    action == "secure_copy"
false_positives:
- Pasting a credential into a tool that cannot be auto-filled
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
