id: det-saas-042
name: 1Password Sign-In Failed on Second Factor
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Sign-In Failed
  on Second Factor'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1621
- mitre.attack.t1111
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    category == "mfa_failed"
false_positives:
- A clock-skewed authenticator
- A lost device
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
