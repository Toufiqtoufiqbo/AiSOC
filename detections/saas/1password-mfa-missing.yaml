id: det-saas-047
name: 1Password Sign-In Attempted Without a Second Factor
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Sign-In Attempted
  Without a Second Factor'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1621
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    type == "mfa_missing"
false_positives:
- An account newly enrolled and not yet configured
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
