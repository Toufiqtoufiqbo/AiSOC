id: det-saas-044
name: 1Password Sign-In Rejected for an Outdated Client
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Sign-In Rejected
  for an Outdated Client'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1078
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    category == "modern_version_failed"
false_positives:
- A device pending an update
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
