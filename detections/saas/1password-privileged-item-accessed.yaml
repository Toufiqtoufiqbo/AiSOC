id: det-saas-054
name: 1Password Privileged Item Accessed
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Privileged
  Item Accessed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1555.005
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    item_name CONTAINS_ANY ["root", "break-glass", "emergency"]
false_positives:
- A genuine break-glass event during an incident
playbook: tpl-credential-compromise
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
