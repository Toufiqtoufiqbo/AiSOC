id: det-saas-058
name: 1Password Account Recovery Initiated
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Account Recovery
  Initiated'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.005
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    action == "recovery_initiate"
false_positives:
- A genuine lockout handled by the service desk
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
