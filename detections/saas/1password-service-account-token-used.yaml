id: det-saas-055
name: 1Password Service Account Token Used
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Service Account
  Token Used'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1078.004
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    type == "service_account_token"
false_positives:
- A sanctioned automation reading a secret
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
