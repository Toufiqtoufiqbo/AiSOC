id: det-saas-048
name: 1Password Sign-In From an Unrecognised Address
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Sign-In From
  an Unrecognised Address'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1078.004
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    category == "success"
    AND src_ip NOT STARTSWITH_ANY ["10.", "192.168.", "172.16."]
false_positives:
- Home working
- Travel
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
