id: det-saas-045
name: 1Password Time-Based One-Time Password Disabled
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Time-Based
  One-Time Password Disabled'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1556.006
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    type == "totp_disabled"
false_positives:
- A user migrating authenticators
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
