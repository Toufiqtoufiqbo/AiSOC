id: det-saas-046
name: 1Password Incorrect One-Time Password
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Incorrect
  One-Time Password'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1111
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    type == "totp_incorrect"
false_positives:
- Clock drift on the authenticator
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
