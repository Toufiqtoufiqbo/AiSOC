id: det-saas-060
name: 1Password Suspended User Reactivated
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Suspended
  User Reactivated'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1098
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    action == "user_reactivate"
false_positives:
- A returning employee
- A mistaken suspension reversed
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
