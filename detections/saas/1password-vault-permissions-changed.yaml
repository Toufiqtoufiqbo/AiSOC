id: det-saas-057
name: 1Password Vault Permissions Changed
description: AiSOC v1 curated detection. Triggers on the saas signal described by '1Password Vault Permissions
  Changed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098
- tlp.white
category: saas
log_source:
  product: 1password
  service: signin
detection:
  condition: |
    action == "vault_permission_grant"
false_positives:
