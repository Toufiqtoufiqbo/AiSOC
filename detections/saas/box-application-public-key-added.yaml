id: det-saas-006
name: Box Application Public Key Added
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Box Application Public
  Key Added'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.001
- mitre.attack.t1550.001
- tlp.white
category: saas
log_source:
  product: box
  service: audit
detection:
  condition: |
    event_type == "APPLICATION_PUBLIC_KEY_ADDED"
false_positives:
- A key rotation on a sanctioned integration
playbook: tpl-credential-compromise
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
