id: det-saas-007
name: Box Application Public Key Deleted
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Box Application Public
  Key Deleted'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1562.001
- tlp.white
category: saas
log_source:
  product: box
  service: audit
detection:
  condition: |
    event_type == "APPLICATION_PUBLIC_KEY_DELETED"
false_positives:
- Decommissioning an integration
- Key rotation
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
