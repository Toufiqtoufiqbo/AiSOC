id: det-saas-015
name: Box Collaboration Invited to a Consumer Domain
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Box Collaboration Invited
  to a Consumer Domain'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1567.002
- tlp.white
category: saas
log_source:
  product: box
  service: audit
detection:
  condition: |
    event_type == "COLLABORATION_INVITE"
    AND actor_email ENDSWITH_ANY ["@gmail.com", "@outlook.com"]
false_positives:
- A sole trader or contractor using a personal address
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
