id: det-saas-002
name: Box External Collaboration Invite From an Abnormal Location
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Box External Collaboration
  Invite From an Abnormal Location'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1567.002
- tlp.white
category: saas
log_source:
  product: box
  service: audit
detection:
  condition: |
    event_type == "SHIELD_EXTERNAL_COLLAB_INVITE_ABNORMAL_LOCATION"
false_positives:
- A colleague travelling
- A partner working from a new office
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
