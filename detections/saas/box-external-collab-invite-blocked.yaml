id: det-saas-003
name: Box External Collaboration Invite Blocked by Policy
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Box External Collaboration
  Invite Blocked by Policy'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1567.002
- tlp.white
category: saas
log_source:
  product: box
  service: audit
detection:
  condition: |
    event_type == "SHIELD_EXTERNAL_COLLAB_INVITE_BLOCKED"
false_positives:
- A user unaware of the external-sharing policy
playbook: tpl-triage
enabled: true
author: AiSOC
