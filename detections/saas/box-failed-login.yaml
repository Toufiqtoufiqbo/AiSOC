id: det-saas-009
name: Box Failed Login
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Box Failed Login'.
  Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1110
- tlp.white
category: saas
log_source:
  product: box
  service: audit
detection:
  condition: |
    event_type == "FAILED_LOGIN"
false_positives:
- A mistyped password
- A stale cached credential
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
