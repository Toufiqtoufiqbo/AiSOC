id: det-saas-005
name: Box Group Administrator Created
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Box Group Administrator
  Created'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.003
- tlp.white
category: saas
log_source:
  product: box
  service: audit
detection:
  condition: |
    event_type == "GROUP_ADMIN_CREATED"
false_positives:
- Delegated group administration being rolled out
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
