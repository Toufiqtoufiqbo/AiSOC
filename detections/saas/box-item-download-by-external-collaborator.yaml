id: det-saas-014
name: Box Item Downloaded by a Consumer-Domain Collaborator
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Box Item Downloaded
  by a Consumer-Domain Collaborator'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1567.002
- mitre.attack.t1530
- tlp.white
category: saas
log_source:
  product: box
  service: audit
detection:
  condition: |
    event_type == "ITEM_DOWNLOAD"
    AND actor_email ENDSWITH_ANY ["@gmail.com", "@yahoo.com", "@outlook.com"]
false_positives:
- A contractor who legitimately uses a personal address
playbook: tpl-data-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
