id: det-saas-011
name: Box Login Device Removed
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Box Login Device Removed'.
  Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1070
- tlp.white
category: saas
log_source:
  product: box
  service: audit
detection:
  condition: |
    event_type == "REMOVE_LOGIN_ACTIVITY_DEVICE"
false_positives:
- Device retirement
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
