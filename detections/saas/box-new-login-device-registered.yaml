id: det-saas-010
name: Box Login From a Newly Registered Device
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Box Login From a Newly
  Registered Device'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1078.004
- tlp.white
category: saas
log_source:
  product: box
  service: audit
detection:
  condition: |
    event_type == "ADD_LOGIN_ACTIVITY_DEVICE"
false_positives:
- A new laptop or phone
- A browser profile reset
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
