id: det-saas-012
name: Box Shared Link Created
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Box Shared Link Created'.
  Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1567.002
- tlp.white
category: saas
log_source:
  product: box
  service: audit
detection:
  condition: |
    event_type == "ITEM_SHARED_LINK"
false_positives:
- Routine sharing with a customer
- A link created for a signed partner
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
