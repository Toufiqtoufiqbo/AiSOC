id: det-saas-022
name: Dropbox Member Admin Role Changed
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Member Admin
  Role Changed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.003
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type == "member_change_admin_role"
false_positives:
- A planned administrator handover
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
