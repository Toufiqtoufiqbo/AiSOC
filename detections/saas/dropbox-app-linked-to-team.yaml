id: det-saas-031
name: Dropbox Application Linked to the Team
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Application
  Linked to the Team'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1550.001
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type == "app_link_team"
false_positives:
- A sanctioned integration being installed
playbook: tpl-triage
enabled: true
author: AiSOC
