id: det-saas-032
name: Dropbox Device Linked
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Device Linked'.
  Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1078.004
- tlp.white
category: saas
