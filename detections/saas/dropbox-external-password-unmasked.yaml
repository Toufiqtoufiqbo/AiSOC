id: det-saas-025
name: Dropbox External Account Password Unmasked
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox External Account
  Password Unmasked'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1555
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type == "account_external_password_unmask"
false_positives:
- A user legitimately retrieving their own stored credential
playbook: tpl-credential-compromise
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
