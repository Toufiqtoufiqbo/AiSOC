id: det-saas-034
name: Dropbox Group Deleted
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Group Deleted'.
  Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1531
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type == "group_delete"
false_positives:
- A project closing
- A reorganisation
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
