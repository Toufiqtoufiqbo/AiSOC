id: det-saas-021
name: Dropbox Shared Link Audience Changed to Public
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Shared Link
  Audience Changed to Public'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1567.002
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
