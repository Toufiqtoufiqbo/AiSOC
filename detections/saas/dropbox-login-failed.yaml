id: det-saas-029
name: Dropbox Login Failed
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Login Failed'.
  Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1110
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type == "login_fail"
false_positives:
- A mistyped password
- An expired session on a mobile client
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
