id: det-saas-030
name: Dropbox Login Succeeded Without Two-Factor
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Login Succeeded
  Without Two-Factor'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1078.004
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type == "login_success"
false_positives:
- An account exempted from MFA by policy
- A service account
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
