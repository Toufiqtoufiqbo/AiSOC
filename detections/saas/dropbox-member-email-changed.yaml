id: det-saas-023
name: Dropbox Member Email Address Changed
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Member Email
  Address Changed'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098
- mitre.attack.t1556
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type == "member_change_email"
false_positives:
- A legal name change
- A domain migration
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
