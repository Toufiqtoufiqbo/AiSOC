id: det-saas-024
name: Dropbox Member Status Changed
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Member Status
  Changed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1098
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type == "member_change_status"
false_positives:
- Onboarding and offboarding
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
