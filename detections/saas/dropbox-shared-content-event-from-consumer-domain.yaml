id: det-saas-036
name: Dropbox Sharing Action by a Consumer-Domain Account
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Sharing Action
  by a Consumer-Domain Account'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1567.002
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type STARTSWITH "shared_content_"
    AND actor_email ENDSWITH_ANY ["@gmail.com", "@outlook.com"]
false_positives:
- A contractor using a personal address
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
