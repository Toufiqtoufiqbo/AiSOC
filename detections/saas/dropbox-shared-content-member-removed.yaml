id: det-saas-035
name: Dropbox Shared Content Member Removed
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Shared Content
  Member Removed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1531
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type == "shared_content_remove_member"
false_positives:
- Offboarding
playbook: tpl-triage
enabled: true
author: AiSOC
