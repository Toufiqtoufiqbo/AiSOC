id: det-saas-039
name: Dropbox Sharing Activity From an Unrecognised Address
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Sharing Activity
  From an Unrecognised Address'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1567.002
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type STARTSWITH "shared_"
    AND src_ip NOT STARTSWITH_ANY ["10.", "192.168.", "172.16."]
false_positives:
- Home working
- A mobile network
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
