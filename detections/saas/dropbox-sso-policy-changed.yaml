id: det-saas-026
name: Dropbox SSO Policy Changed
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox SSO Policy
  Changed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1556.007
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type == "sso_change_policy"
false_positives:
- A federation migration
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
