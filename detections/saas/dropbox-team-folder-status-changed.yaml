id: det-saas-028
name: Dropbox Team Folder Status Changed
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Team Folder
  Status Changed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1565
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type == "team_folder_change_status"
false_positives:
- Archiving a finished project
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
