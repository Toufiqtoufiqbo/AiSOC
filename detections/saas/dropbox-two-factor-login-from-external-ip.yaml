id: det-saas-040
name: Dropbox Two-Factor Login From an External Address
description: AiSOC v1 curated detection. Triggers on the saas signal described by 'Dropbox Two-Factor
  Login From an External Address'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1078.004
- tlp.white
category: saas
log_source:
  product: dropbox
  service: audit
detection:
  condition: |
    event_type == "login_success_with_two_factor"
    AND src_ip NOT STARTSWITH_ANY ["10.", "192.168."]
false_positives:
- Home working
- Travel
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
